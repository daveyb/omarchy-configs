[Sleep]
# Dell XPS 13 9305 only exposes s2idle, not S3. s2idle still draws ~2W and
# runs warm — a bag-of-death if anything still uses suspend-then-hibernate.
# Lid close hibernates immediately (see 30-clamshell-ac.conf and
# ~/.config/hypr/scripts/lid-close.sh). Keep a short delay only as a
# backstop for other suspend-then-hibernate callers.
HibernateDelaySec=2min
HibernateOnACPower=yes
