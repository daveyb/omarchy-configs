[Service]
# Omarchy ships SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=false for NVIDIA.
# This machine is Intel. Leaving the session unfrozen lets Hyprland and
# monitor-watch re-enable the panel when s2idle wakes to write the
# hibernation image, which lights a closed lid.
Environment="SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=true"
