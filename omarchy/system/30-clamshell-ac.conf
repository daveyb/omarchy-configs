[Login]
# Closed lid with no extra display must power off. This XPS only has s2idle,
# which still draws ~2W and runs warm — a bag-of-death. Hibernate, do not
# s2idle. This applies on battery AND on a charger (hotel / travel).
#
# Clamshell (Studio Display) is HandleLidSwitchDocked=ignore plus a userspace
# lid-switch inhibitor held while an external display is actually connected.
# Do not use "on AC" as a proxy for docked: a traveler on a charger is not
# docked, and ignoring lid-on-AC left this laptop running in a bag.
HandleLidSwitch=hibernate
HandleLidSwitchDocked=ignore
HandleLidSwitchExternalPower=hibernate
LidSwitchIgnoreInhibited=no
